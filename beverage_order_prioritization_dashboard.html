<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beverage Order Dashboard</title>
<style>
:root{
  --navy:#102a35; --teal:#0b4d4a; --green:#39a96b; --light:#f4f7f8;
  --text:#13232d; --muted:#61717b; --border:#dfe7ea; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--light);color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:linear-gradient(180deg,#0b292e,#073b39);color:white;padding:28px 16px;position:fixed;inset:0 auto 0 0}
.brand{font-size:20px;font-weight:800;line-height:1.2;margin:18px 8px 30px}
.logo{font-size:42px;margin:0 8px}
.nav a{display:block;padding:13px 14px;margin:7px 0;border-radius:9px;color:#dceceb;text-decoration:none}
.nav a.active,.nav a:hover{background:#244f50;color:#fff}
.tagline{position:absolute;bottom:25px;left:27px;color:#a9c4c2;font-size:13px;line-height:1.5;font-style:italic}
.main{margin-left:230px;padding:28px;flex:1}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header h1{margin:0;font-size:28px}.header p{margin:5px 0 0;color:#506674}
.live{font-size:13px;color:#16825b;font-weight:700}.live span{display:inline-block;width:9px;height:9px;background:#22a06b;border-radius:50%;margin-right:7px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 7px #102a3510}
.queue-main{padding:22px 24px}
.queue-main h3{font-size:22px;margin:0 0 16px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{background:#f3f7f8;text-align:left;color:#566873;font-weight:600;padding:12px 10px}
.table td{padding:12px 10px;border-bottom:1px solid #edf1f2}
.prepare{background:#07594f;color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px}
.prepare:hover{background:#063f3a}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.controls select,.controls input{padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff}
@media(max-width:750px){.sidebar{display:none}.main{margin:0;padding:16px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">🥤</div>
  <div class="brand">Beverage Order<br>Dashboard</div>
  <nav class="nav">
    <a href="#queue">⌂ &nbsp; Overview</a>
    <a class="active" href="#queue">☷ &nbsp; Order Queue</a>
    <a href="#queue">▥ &nbsp; Analytics</a>
    <a href="#">⚙ &nbsp; Settings</a>
  </nav>
  <div class="tagline">Better data.<br>Faster drinks.<br>Happier customers.</div>
</aside>

<main class="main">
<header class="header">
  <div><h1>Order Queue</h1><p>Prioritize and prepare the next drinks in line.</p></div>
  <div><div class="live"><span></span>Live Data</div><small id="clock"></small></div>
</header>

<div class="card queue-main" id="queue">
  <h3>Active Orders</h3>
  <div class="controls">
    <select id="methodFilter"><option value="all">All Methods</option><option>In-House</option><option>Mobile</option><option>Delivery</option></select>
    <input id="search" placeholder="Search order #">
  </div>
  <table class="table"><thead><tr><th>#</th><th>Order ID</th><th>Method</th><th>Items</th><th>Wait Time</th><th>Action</th></tr></thead>
  <tbody id="queueBody"></tbody></table>
</div>
</main>
</div>

<script>
const orders=[
{id:1042,method:"Mobile",items:3,wait:14},
{id:1039,method:"Delivery",items:5,wait:11},
{id:1047,method:"In-House",items:2,wait:8},
{id:1041,method:"Delivery",items:4,wait:9},
{id:1045,method:"Mobile",items:1,wait:5},
{id:1048,method:"In-House",items:3,wait:4},
{id:1046,method:"Mobile",items:6,wait:2},
{id:1037,method:"Delivery",items:2,wait:1},
{id:1043,method:"In-House",items:1,wait:0},
{id:1049,method:"Mobile",items:4,wait:0}
];

function render(){
 const mf=document.getElementById("methodFilter").value;
 const q=document.getElementById("search").value.trim();
 const filtered=orders.filter(o=>(mf==="all"||o.method===mf)&&(q===""||String(o.id).includes(q)));
 document.getElementById("queueBody").innerHTML=filtered.map((o,i)=>{
   return `<tr><td>${i+1}</td><td><strong>#${o.id}</strong></td><td>${o.method}</td><td>${o.items}</td><td>${o.wait} min</td><td><button class="prepare" onclick="prepare(${o.id})">Prepare</button></td></tr>`;
 }).join("");
}
function prepare(id){
 const idx=orders.findIndex(o=>o.id===id);
 if(idx>-1){orders.splice(idx,1);render();}
}
document.querySelectorAll("select,input").forEach(e=>e.addEventListener("input",render));
function clock(){document.getElementById("clock").textContent=new Date().toLocaleString([], {dateStyle:"medium",timeStyle:"short"});}
render();clock();setInterval(clock,1000);
</script>
</body>
</html>
